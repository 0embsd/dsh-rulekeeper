# dsh-rulekeeper —— profile 插件行注册（**LF-450/630 前置：可装载 bundle**）
#
# 由 `profiles/<profile>/package.json` 的 `dsh.profile.bundles` 引入
# （本包 `package.json` 的 `dsh.bundle.patch` 指向本文件，形态与 `dsh-observation-pack` / `dsh-gate-bypass-guard` 一致）。
#
# **文件名为什么不叫 `cordis.patch.yml`**：2026-09-15 实测——`dsh-rule-engine` 的 `__self-protect` 规则把
#   `cordis.patch.yml` 这一路径视为它的自保护面，写该文件会被宿主硬拦截（需要人 `/guard unlock`）。
#   本包改用自己的文件名，避免与第三方插件的自保护面撞名（内容仍是标准 `- insert:` 挂载描述）。
#
# 宿主面（host plane）：本插件监听工具管线事件并注册 `rulekeeper_*` 工具（进程级注册表 ⇒ 不能放进 agent 预设）。
#
# 装载后行为：**零拦截**（默认 handlers 返回 `allow`）——装载只验证"能装上 + 与第三方同场不互相打断"。
# 回滚：① 从 `profiles/<profile>/package.json` 的 `dsh.profile.bundles` 移除 `dsh-rulekeeper`（`dependencies` 的 link 可留）；
#       ② 或直接删掉该 profile 目录（旁路 profile 专用）。
- insert:
    - id: dsh-rulekeeper
      name: 'dsh-rulekeeper'
